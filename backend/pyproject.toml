[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "psycopg>=3.3.6",
    "pwdlib[argon2,bcrypt]>=0.3.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.0",
    "pytest>=9.1.1",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.46",
    "tenacity>=9.2.1",
    "uvicorn[standard,standart]>=0.53.0",
]


[project.scripts]
backend = "backend.src.backend:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
